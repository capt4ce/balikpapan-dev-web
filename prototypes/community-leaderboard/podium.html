<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podium Spotlight — Balikpapan.dev</title><link rel="stylesheet" href="shared.css"><style>.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:end;margin-top:40px}.pod{background:white;border:1px solid #dce6ed;border-radius:24px;padding:24px;text-align:center;position:relative;box-shadow:0 14px 35px #14314d12}.pod.p1{padding-top:38px;background:linear-gradient(180deg,#e6fffb,#fff);border-color:#75d8cb}.pod .avatar{width:68px;height:68px;margin:6px auto}.pod h3{margin:14px 0 2px}.pod p{margin:0 0 12px;color:#789}.medal{position:absolute;top:14px;left:16px;background:#092f4e;color:white;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:800}.badge-row{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:12px}.list{background:white;border:1px solid #dce6ed;border-radius:20px;margin-top:18px;overflow:hidden}.row{display:grid;grid-template-columns:30px 44px 1.3fr 1.6fr 55px 90px;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid #edf2f5}.row:last-child{border:0}.row .avatar{width:38px;height:38px;font-size:12px}.who{display:flex;flex-direction:column}.who small{color:#8293a3}.rank{color:#789}@media(max-width:650px){.podium{grid-template-columns:1fr}.pod.p1{order:-1}.row{grid-template-columns:24px 40px 1fr 35px 65px;padding:12px 10px}.badge-row{justify-content:center}}</style></head><body><div class="shell"><header class="top"><div class="brand"><i>B</i> Balikpapan.dev</div><a class="back" href="../../">Prototype review ↗</a></header><section class="hero"><span class="eyebrow">Community leaderboard</span><h1>Podium Spotlight</h1><p>Celebrate the people moving Balikpapan’s developer community forward.</p><span class="range"></span></section><div id="tabs"></div><div id="board"></div><script>function render(m){let top=m.slice(0,3),rest=m.slice(3);document.querySelector('#board').innerHTML=`<section class="podium">${[top[1],top[0],top[2]].map((x,i)=>`<article class="pod p${i}"><div class="medal">${i===1?'1':i===0?'2':'3'}</div><div class="avatar">${x.avatar}</div><h3>${x.name}</h3><p>${x.handle}</p><strong>${x.points.toLocaleString()} pts</strong><div class="badge-row">${badges(x.badges.slice(0,2))}</div></article>`).join('')}</section><section class="list">${rest.map((x,i)=>`<div class="row"><b class="rank">${i+4}</b><div class="avatar">${x.avatar}</div><div class="who"><strong>${x.name}</strong><small>${x.handle}</small></div><div class="badge-row hide-mobile">${badges(x.badges)}</div><div>${change(x.change)}</div><div class="score">${x.points.toLocaleString()}</div></div>`).join('')}</section>`}</script><div class="switch"><a href="podium.html">Podium</a> · <a href="badge-trail.html">Badge trail</a> · <a href="community-table.html">Community table</a></div><p class="foot">Prototype data · Updated 7 September 2026</p></div><script src="shared.js"></script><script>document.querySelector('#tabs').innerHTML=tabs()</script></body></html>
