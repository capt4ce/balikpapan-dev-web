<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Badge Trail — Balikpapan.dev</title><link rel="stylesheet" href="shared.css"><style>.layout{display:grid;grid-template-columns:1.6fr .8fr;gap:22px;align-items:start}.trail{background:#fff;border:1px solid #e0e7ed;border-radius:18px;padding:16px;display:grid;grid-template-columns:40px 52px 1fr auto;gap:14px;align-items:center;margin-bottom:10px}.trail:hover{transform:translateY(-2px);box-shadow:0 10px 25px #1232}.trail .avatar{width:50px;height:50px}.place{font-weight:900;color:#0f766e}.person h3{margin:0 0 2px}.person>span{font-size:13px;color:#789}.person .badge-row{justify-content:flex-start;margin-top:8px}.score{text-align:right;font-size:20px}.score small{display:block;font-size:11px;color:#789}aside{background:#092f4e;color:white;border-radius:24px;padding:22px;position:sticky;top:20px}aside .muted{color:#b6c8d7}.award{display:flex;gap:12px;padding:13px 0;border-top:1px solid #ffffff20}.award i{font-style:normal;width:38px;height:38px;border-radius:11px;background:#ffffff18;display:grid;place-items:center;color:#5eead4}.award small{display:block;color:#bfd0dc;font-size:11px;margin-top:3px}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{position:static}.trail{grid-template-columns:34px 44px 1fr}.trail .score{grid-column:3;text-align:left;font-size:15px}.trail .avatar{width:42px;height:42px}}</style></head><body><div class="shell"><header class="top"><div class="brand"><i>B</i> Balikpapan.dev</div><a class="back" href="../../">Prototype review ↗</a></header><section class="hero"><span class="eyebrow">Community leaderboard</span><h1>Badge Trail</h1><p>A warmer, achievement-led view that makes every contribution feel collectible.</p><span class="range"></span></section><div id="tabs"></div><div class="layout"><main id="board"></main><aside><h3>Badge cabinet</h3><p class="muted">Ways to earn your next mark.</p><div id="catalog"></div></aside></div><script>function render(m){document.querySelector('#board').innerHTML=m.map((x,i)=>`<article class="trail"><div class="place">#${i+1}</div><div class="avatar">${x.avatar}</div><div class="person"><h3>${x.name}</h3><span>${x.handle} · ${x.streak} day streak</span><div class="badge-row">${badges(x.badges)}</div></div><div class="score">${x.points.toLocaleString()}<small>points</small></div></article>`).join('');document.querySelector('#catalog').innerHTML=DATA.badgeCatalog.map(b=>`<div class="award"><i>${b.icon}</i><div><b>${b.name}</b><small>${b.description}</small></div></div>`).join('')}</script><div class="switch"><a href="podium.html">Podium</a> · <a href="badge-trail.html">Badge trail</a> · <a href="community-table.html">Community table</a></div><p class="foot">Prototype data · Updated 7 September 2026</p></div><script src="shared.js"></script><script>document.querySelector('#tabs').innerHTML=tabs()</script></body></html>
